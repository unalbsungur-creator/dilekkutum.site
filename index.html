<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2eb">
  <meta name="description" content="Dilekkutum yakında yayında. Sevdiklerinize özel, özenle hazırlanan hediye kutuları için hazırlanıyoruz.">
  <title>Dilekkutum | Çok Yakında</title>
  <style>
    :root {
      --cream: #f7f2eb;
      --paper: #fffdf9;
      --brown: #49362d;
      --muted: #88766a;
      --gold: #b89462;
      --line: #e8ded1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 15%, #eee1d1 0, transparent 42%),
        radial-gradient(ellipse at 90% 85%, #e9ddce 0, transparent 38%),
        var(--cream);
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .page {
      width: min(100%, 760px);
      min-height: 590px;
      background: rgba(255, 253, 249, .88);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(32px, 7vw, 72px) 24px;
      position: relative;
      overflow: hidden;
    }

    .page::before, .page::after {
      content: "✦";
      position: absolute;
      color: var(--gold);
      opacity: .55;
      font-size: 22px;
    }

    .page::before { top: 28px; left: 30px; }
    .page::after { right: 30px; bottom: 28px; }

    .brand {
      font-family: Arial, sans-serif;
      font-size: clamp(29px, 5vw, 39px);
      font-weight: 700;
      letter-spacing: -1.8px;
      margin-bottom: 12px;
    }

    .brand span { color: var(--gold); }

    .eyebrow {
      font: 11px/1.5 Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--muted);
      margin: 0 0 26px;
    }

    .gift {
      width: 118px;
      height: 105px;
      position: relative;
      margin: 5px 0 28px;
    }

    .gift-body {
      position: absolute;
      width: 104px;
      height: 68px;
      left: 7px;
      bottom: 0;
      background: #b78e68;
      border: 1px solid #a57c58;
      border-radius: 2px 2px 5px 5px;
    }

    .gift-lid {
      position: absolute;
      width: 118px;
      height: 19px;
      left: 0;
      bottom: 62px;
      background: #d2b18c;
      border: 1px solid #b78e68;
      border-radius: 3px;
    }

    .gift-ribbon {
      position: absolute;
      z-index: 2;
      width: 18px;
      height: 83px;
      left: 50px;
      bottom: 0;
      background: #f2dfbd;
      border-left: 1px solid #e2c99f;
      border-right: 1px solid #e2c99f;
    }

    .bow {
      position: absolute;
      z-index: 3;
      left: 40px;
      top: 0;
      width: 38px;
      height: 22px;
      border: 5px solid #f2dfbd;
      border-radius: 70% 20% 70% 20%;
      transform: rotate(-20deg);
    }

    .bow::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 19px;
      left: 5px;
      top: -5px;
      border: 5px solid #f2dfbd;
      border-radius: 20% 70% 20% 70%;
      transform: rotate(48deg);
    }

    h1 {
      font-size: clamp(34px, 7vw, 53px);
      font-weight: 400;
      line-height: 1.13;
      letter-spacing: -1.7px;
      max-width: 580px;
      margin: 0;
    }

    h1 em {
      color: var(--gold);
      font-weight: 400;
    }

    .description {
      font: 15px/1.9 Arial, sans-serif;
      color: var(--muted);
      max-width: 430px;
      margin: 23px 0 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 19px;
      border: 1px solid var(--line);
      border-radius: 30px;
      font: 11px Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--brown);
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 0 4px #b894621c;
    }

    .footer {
      margin-top: 48px;
      color: #9a897b;
      font: 10px Arial, sans-serif;
      letter-spacing: 1.5px;
    }

    @media (max-width: 480px) {
      .page { min-height: 550px; }
      .description { font-size: 14px; }
      .footer { margin-top: 38px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">dilek<span>kutum</span></div>
    <p class="eyebrow">Her kutuda bir mutluluk</p>

    <div class="gift" aria-hidden="true">
      <div class="gift-body"></div>
      <div class="gift-ribbon"></div>
      <div class="gift-lid"></div>
      <div class="bow"></div>
    </div>

    <h1>Güzel şeyler<br><em>özenle hazırlanıyor.</em></h1>

    <p class="description">
      Sevdiklerinize özel, her ayrıntısı düşünülmüş hediye kutuları için
      hazırlanıyoruz. Dilekkutum çok yakında burada.
    </p>

    <div class="status">
      <span class="dot"></span>
      Çok yakında yayındayız
    </div>

    <div class="footer">DİLEKKUTUM · HER DİLEĞE ÖZEL</div>
  </main>
</body>
</html>
